# ---------------------------------------------------------------------------
# Deployment stack.
#
# CONFIGURATION CONTRACT
#
# The root `.env` file is the single source of truth (see `.env.example`).
# Compose auto-loads it and interpolates the `${...}` references below:
#
#   ${VAR:?message}  required -> `docker compose up` aborts with `message`
#   ${VAR:-default}  optional -> falls back to `default`
#
# So a missing variable fails immediately, naming itself, before any container
# starts.
#
# The per-package env files (`apps/api/.env`, `packages/db/.env`,
# `packages/api/.env`) are for HOST tooling only (`pnpm dev`, prisma, orval).
# They point at `localhost` and are deliberately NOT read by any container:
# inside the network the hosts are `postgres` and `redis`, not `localhost`.
# ---------------------------------------------------------------------------

# Credentials are declared once (as parts) and the DSN is assembled here, so
# the compose file and the database container can never drift apart.
x-database-url: &database_url postgresql://${POSTGRES_USER:?required in .env}:${POSTGRES_PASSWORD:?required in .env}@postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB:?required in .env}

# Shared by `api` and `migrate` so both run the exact same image.
x-api-image: &api_image
  image: ${API_IMAGE:-tma-api:latest}
  build:
    context: .
    dockerfile: ./apps/api/Dockerfile
  networks:
    - app_network

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - app_network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine

    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

    restart: unless-stopped

    networks:
      - app_network

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # Migrations (one-shot)
  #
  # Runs `prisma migrate deploy` and exits. The API waits for it to succeed, so
  # a deploy can never boot against an outdated schema.
  # ---------------------------------------------------------------------------
  migrate:
    <<: *api_image

    working_dir: /app/packages/db

    command: ["node_modules/.bin/prisma", "migrate", "deploy"]

    environment:
      DATABASE_URL: *database_url

    depends_on:
      postgres:
        condition: service_healthy

    # One-shot task: never restart it.
    restart: "no"

  # ---------------------------------------------------------------------------
  # Nest API
  # ---------------------------------------------------------------------------
  api:
    <<: *api_image

    environment:
      DATABASE_URL: *database_url
      REDIS_URL: redis://redis:6379

      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-4000}
      CACHE_TTL: ${CACHE_TTL:-60000}
      CORS_ORIGINS: ${CORS_ORIGINS:?required in .env (e.g. https://your-domain.tld)}

      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?required - bot whose init data authenticates callers}

    restart: unless-stopped

    # Don't start api until DB and Redis are healthy and migrations applied.
    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      migrate:
        condition: service_completed_successfully

    # Publish container port. With a reverse proxy (caddy/nginx) in front on the
    # VPS, change this to "127.0.0.1:${API_PORT:-4000}:${PORT:-4000}".
    ports:
      - "${API_PORT:-4000}:${PORT:-4000}"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||4000)+'/api-json').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Payment gateway API
  # ---------------------------------------------------------------------------
  ton-payment-api:
    image: ghcr.io/clayzenx/ton-payment-api:latest

    restart: unless-stopped

    environment:
      # Your database. Use the service name of your Postgres container as the
      # host (not `localhost`) when it runs in the same compose project.
      #DATABASE_URL: ${DATABASE_URL:?required - e.g. postgresql://user:pass@postgres:5432/ton_payment}
      DATABASE_URL: *database_url

      # --- required: the merchant configuration ---
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?required - bot whose init data authenticates callers}
      PAYMENT_WALLET: ${PAYMENT_WALLET:?required - TON address that receives payments}
      TONCENTER_API_KEY: ${TONCENTER_API_KEY:?required - https://toncenter.com}
      USDT_JETTON_MASTER: ${USDT_JETTON_MASTER:?required - USDT jetton master for your network}

      # --- optional (defaults are TESTNET) ---
      TONCENTER_API_URL: ${TONCENTER_API_URL:-https://testnet.toncenter.com/api/v2/jsonRPC}
      TONCENTER_WS_URL: ${TONCENTER_WS_URL:-wss://testnet.toncenter.com/api/streaming/v2/ws}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}

      PORT: 4020

    ports:
      - "4020:4020"

    networks:
      - app_network


# Docker managed persistent storage.
volumes:
  postgres_data:

# Entire app network
networks:
  app_network:
