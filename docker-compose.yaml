# ---------------------------------------------------------------------------
# ton-payment — standalone stack (Postgres + API).
#
#   cp .env.example .env      # fill in the four required values
#   docker compose up -d      # builds the image on first run
#
# Two containers, one volume, one network. The API applies its own migrations
# on startup, so there is no migration job to run and no ordering to get
# right.
#
# Already have a Postgres instance, or want to drop the API into an existing
# project's compose file? Use `docker-compose.integration.yml` instead.
# ---------------------------------------------------------------------------
name: ton-payment

# Credentials are declared once, as parts, and the DSN is assembled here so
# the API and the database can never disagree about them. Inside the network
# the host is `postgres`, never `localhost`.
x-database-url: &database_url postgresql://${POSTGRES_USER:-ton_payment}:${POSTGRES_PASSWORD:?required - set it in .env}@postgres:5432/${POSTGRES_DB:-ton_payment}

services:
  # -------------------------------------------------------------------------
  # PostgreSQL — dedicated to this service, never shared.
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ton_payment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required - set it in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ton_payment}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    # Not published: only the API needs to reach it. Uncomment for host
    # access (psql, backups) — it stays bound to loopback.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ton_payment} -d ${POSTGRES_DB:-ton_payment}"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - ton_payment

  # -------------------------------------------------------------------------
  # Payment API — REST + socket.io, and the on-chain watcher.
  # -------------------------------------------------------------------------
  api:
    image: ${API_IMAGE:-ton-payment-api:latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile

    restart: unless-stopped

    environment:
      DATABASE_URL: *database_url

      # --- required: the merchant configuration -----------------------------
      # Missing values abort `docker compose up` by name, before anything
      # starts; the API also validates them again at boot.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?required - bot whose init data authenticates callers}
      PAYMENT_WALLET: ${PAYMENT_WALLET:?required - TON address that receives payments}
      TONCENTER_API_KEY: ${TONCENTER_API_KEY:?required - https://toncenter.com}
      USDT_JETTON_MASTER: ${USDT_JETTON_MASTER:?required - USDT jetton master for your network}

      # --- optional ---------------------------------------------------------
      # Defaults are TESTNET. Switch both URLs together to go to mainnet, and
      # remember USDT_JETTON_MASTER differs per network.
      TONCENTER_API_URL: ${TONCENTER_API_URL:-https://testnet.toncenter.com/api/v2/jsonRPC}
      TONCENTER_WS_URL: ${TONCENTER_WS_URL:-wss://testnet.toncenter.com/api/streaming/v2/ws}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}

    depends_on:
      postgres:
        condition: service_healthy

    # Bound to loopback by default: put a reverse proxy in front for TLS.
    # Set API_BIND=0.0.0.0 to publish it directly.
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-4000}:4000"

    networks:
      - ton_payment

volumes:
  postgres_data:

networks:
  ton_payment:
