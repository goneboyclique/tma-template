# ---------------------------------------------------------------------------
# ton-payment — drop-in service for an existing project.
#
# Use this when you already run Postgres and want the payment service to sit
# next to your own containers. It brings no database and no volume: just the
# API, pointed at a DSN you provide.
#
#   docker compose -f docker-compose.integration.yml up -d
#
# Or copy the `ton-payment-api` service straight into your own compose file.
#
# The container creates its own tables on first start (`prisma migrate
# deploy`), so an empty database — or a dedicated schema — is all it needs.
# Set RUN_MIGRATIONS=false if you prefer to apply them out of band.
# ---------------------------------------------------------------------------
name: ton-payment

services:
  ton-payment-api:
    # Build from source instead by replacing `image:` with:
    # build:
    #   context: .
    #   dockerfile: apps/api/Dockerfile
    image: ghcr.io/clayzenx/ton-payment-api:latest

    restart: unless-stopped

    environment:
      # Your database. Use the service name of your Postgres container as the
      # host (not `localhost`) when it runs in the same compose project.
      #DATABASE_URL: ${DATABASE_URL:?required - e.g. postgresql://user:pass@postgres:5432/ton_payment}
      DATABASE_URL: postgresql://postgres:postgres@ton-payment-postgres-1:5432/app-db

      # --- required: the merchant configuration ---
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?required - bot whose init data authenticates callers}
      PAYMENT_WALLET: ${PAYMENT_WALLET:?required - TON address that receives payments}
      TONCENTER_API_KEY: ${TONCENTER_API_KEY:?required - https://toncenter.com}
      USDT_JETTON_MASTER: ${USDT_JETTON_MASTER:?required - USDT jetton master for your network}

      # --- optional (defaults are TESTNET) ---
      TONCENTER_API_URL: ${TONCENTER_API_URL:-https://testnet.toncenter.com/api/v2/jsonRPC}
      TONCENTER_WS_URL: ${TONCENTER_WS_URL:-wss://testnet.toncenter.com/api/streaming/v2/ws}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}

    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-4000}:4000"

    # Reaching a database that lives in another compose project requires
    # joining its network. Uncomment both blocks and set NETWORK to it.
    networks:
      - shared
networks:
  shared:
    external: true
    name: ton-payment_ton_payment
